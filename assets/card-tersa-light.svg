<rect class="tok" style="animation-delay:0.00s" x="411" y="78" width="30" height="5" rx="2.5" fill="#0E6569"/><rect class="tok" style="animation-delay:0.25s" x="411" y="91" width="38" height="5" rx="2.5" fill="#0E6569"/><rect class="tok" style="animation-delay:0.50s" x="411" y="104" width="22" height="5" rx="2.5" fill="#0E6569"/><rect class="tok" style="animation-delay:0.75s" x="411" y="117" width="34" height="5" rx="2.5" fill="#0E6569"/><rect class="tok" style="animation-delay:1.00s" x="411" y="130" width="26" height="5" rx="2.5" fill="#0E6569"/><rect class="tok" style="animation-delay:1.25s" x="411" y="143" width="36" height="5" rx="2.5" fill="#0E6569"/>
<rect class="tok" style="animation-delay:1.60s" x="497" y="78" width="36" height="5" rx="2.5" fill="#B4730A"/><rect class="tok" style="animation-delay:1.85s" x="497" y="91" width="30" height="5" rx="2.5" fill="#B4730A"/><rect class="tok" style="animation-delay:2.10s" x="497" y="104" width="38" height="5" rx="2.5" fill="#B4730A"/><rect class="tok" style="animation-delay:2.35s" x="497" y="117" width="24" height="5" rx="2.5" fill="#B4730A"/><rect class="tok" style="animation-delay:2.60s" x="497" y="130" width="34" height="5" rx="2.5" fill="#B4730A"/><rect class="tok" style="animation-delay:2.85s" x="497" y="143" width="28" height="5" rx="2.5" fill="#B4730A"/>
<path d="M461 114H485M479 108l6 6-6 6" fill="none" stroke="#55625F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="mono" x="430" y="178" text-anchor="middle" font-size="10.5" fill="#55625F">.tsa</text><text class="mono" x="516" y="178" text-anchor="middle" font-size="10.5" fill="#55625F">.py</text>
<text class="mono" x="34" y="48" font-size="11" letter-spacing="2" fill="#0E6569">PROGRAMMING LANGUAGE</text>
<text class="sans" x="33" y="86" font-size="30" font-weight="700" letter-spacing="-0.6" fill="#16211F">Tersa</text>
<text class="sans" x="34" y="116" font-size="15" fill="#55625F">A compact, type-safe programming</text><text class="sans" x="34" y="138" font-size="15" fill="#55625F">language built for AI-written code.</text><text class="sans" x="34" y="160" font-size="15" fill="#55625F">Compiles to Python.</text>
<circle cx="39" cy="198" r="5" fill="#B4730A"/><text class="mono" x="52" y="202.5" font-size="12" letter-spacing="0.4" fill="#55625F">TypeScript</text>
</g>
