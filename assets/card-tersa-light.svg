<svg xmlns="http://www.w3.org/2000/svg" width="588" height="236" viewBox="0 0 588 236" role="img" aria-labelledby="t d">
<title id="t">Tersa</title>
<desc id="d">Tersa. A compact, type-safe programming language built for AI-written code. Compiles to Python. Written in TypeScript.</desc>
<style>
.sans{font-family:-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif}
.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.static{display:none}

.breath{transform-box:fill-box;transform-origin:center;animation:breath 18s cubic-bezier(0.45,0,0.55,1) infinite}
@keyframes breath{0%,100%{transform:scale(1)}45%{transform:scale(1.045)}55%{transform:scale(1.045)}}
.orbA{animation:orbA 9s linear infinite}.orbB{animation:orbB 12s linear infinite}
@keyframes orbA{to{stroke-dashoffset:-100}}@keyframes orbB{to{stroke-dashoffset:100}}

.lev{animation:lev 6s ease-in-out infinite alternate}@keyframes lev{from{transform:translateY(-2.5px)}to{transform:translateY(2.5px)}}
.trace{animation:trace 9s linear infinite}@keyframes trace{to{stroke-dashoffset:-100}}
.al{transform-box:fill-box;transform-origin:center;animation:al 3s ease-in-out infinite}.al1{animation-delay:.4s}.al2{animation-delay:.8s}.al3{animation-delay:1.2s}
@keyframes al{0%,100%{opacity:.35;transform:scale(.8)}50%{opacity:1;transform:scale(1.15)}}
.sw{animation:sw 6s cubic-bezier(0.22, 1, 0.36, 1) infinite}@keyframes sw{0%{transform:translateY(0);opacity:0}10%{opacity:.9}80%{transform:translateY(126px);opacity:.9}100%{transform:translateY(126px);opacity:0}}
.tok{transform-box:fill-box;transform-origin:left center;animation:tok 6s cubic-bezier(0.22, 1, 0.36, 1) infinite}@keyframes tok{0%{transform:scaleX(0);opacity:0}8%{transform:scaleX(1);opacity:1}80%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.bar{transform-box:fill-box;transform-origin:center bottom;animation:bar 6s cubic-bezier(0.22, 1, 0.36, 1) infinite}@keyframes bar{0%{transform:scaleY(.15)}18%,88%{transform:scaleY(1)}100%{transform:scaleY(.15)}}
.chk2{transform-box:fill-box;transform-origin:center;animation:ck2 6s cubic-bezier(0.22, 1, 0.36, 1) infinite}@keyframes ck2{0%,22%{transform:scale(0)}30%{transform:scale(1.2)}36%,88%{transform:scale(1)}100%{transform:scale(0)}}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
  .smil{display:none !important}
  .static{display:inline !important}
  .sw{opacity:0}
}
</style>
<defs>
<linearGradient id="spec" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/><stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
<radialGradient id="mglow"><stop offset="0" stop-color="#0E6569" stop-opacity="0.30"/><stop offset="0.55" stop-color="#0E6569" stop-opacity="0.08"/><stop offset="1" stop-color="#0E6569" stop-opacity="0"/></radialGradient>
</defs>
