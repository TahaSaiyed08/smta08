<rect x="6" y="14" width="576" height="214" rx="12" fill="#DDE2DB"/>
<rect x="6" y="7" width="576" height="214" rx="12" fill="#F6F7F3" stroke="#CFD6CF"/>
<rect x="20" y="7" width="548" height="1" fill="url(#spec)"/>
<rect class="trace" x="6" y="7" width="576" height="214" rx="12" fill="none" stroke="#0E6569" stroke-width="1.5" pathLength="100" stroke-dasharray="10 90" stroke-linecap="round" style="animation-delay:-4.5s"/>
<rect x="382" y="27" width="182" height="174" rx="6" fill="#FFFFFF" stroke="#CFD6CF"/>
