.mono{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace}
.static{display:none}

.bus{animation:bus 6s linear infinite}@keyframes bus{from{transform:translateX(0)}to{transform:translateX(900px)}}
.plg{opacity:0;animation:plg 6s ease-in-out infinite}@keyframes plg{0%,100%{opacity:0}12%{opacity:.95}30%{opacity:0}}
.pl{animation:pl 6s ease-in-out infinite}@keyframes pl{0%,100%{transform:translateY(0)}12%{transform:translateY(-2px)}30%{transform:translateY(0)}}

@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
  .smil{display:none !important}
  .static{display:inline !important}
  
}
</style>
