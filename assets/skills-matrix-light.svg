<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="292" viewBox="0 0 1200 292" role="img" aria-labelledby="t d">
<title id="t">Tech stack</title>
<desc id="d">Skills grouped in four rows. Languages: JavaScript (ES6+), TypeScript, Java, SQL, C/C++, HTML, CSS. Frontend: React, Next.js 14 (App Router), Tailwind CSS, TanStack Query. Backend: Node.js, Spring Boot, REST APIs, Prisma, JPA/Hibernate. Data &amp; Cloud: PostgreSQL, MySQL, MongoDB, SQLite, Supabase, Vercel, Git.</desc>
