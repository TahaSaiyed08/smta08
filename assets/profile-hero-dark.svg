<title id="t">Hi, I am Taha Saiyed</title>
<desc id="d">Hi, I'm Taha Saiyed. Full-stack developer in Vancouver, BC. Rotating lines: I build privacy-first tools for everyday admin. Next.js, TypeScript, Java, Spring Boot. Open to co-op and internship roles. Behind the text, a grid with connected points and small lights moving along the lines.</desc>
<style>
