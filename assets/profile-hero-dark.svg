.static{display:none}

.pg1{animation:pg1 18s linear infinite}.pg2{animation:pg2 36s linear infinite}
@keyframes pg1{to{transform:translate(40px,40px)}}@keyframes pg2{to{transform:translate(-120px,120px)}}
.vec{animation:vec 6s linear infinite}@keyframes vec{to{stroke-dashoffset:-100}}
.nd{transform-box:fill-box;transform-origin:center;animation:nd 6s ease-in-out infinite alternate}@keyframes nd{from{transform:translate(-2px,2px)}to{transform:translate(3px,-3px)}}
