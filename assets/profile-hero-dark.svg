.tk{opacity:0;animation:tk 9s cubic-bezier(0.22, 1, 0.36, 1) infinite}.tk0{opacity:1}.tk1{animation-delay:3s}.tk2{animation-delay:6s}
@keyframes tk{0%{opacity:0;transform:translateY(8px)}5.000%{opacity:1;transform:translateY(0)}28.333%{opacity:1;transform:translateY(0)}33.333%{opacity:0;transform:translateY(-8px)}100%{opacity:0;transform:translateY(-8px)}}
.fil{transform-box:fill-box;transform-origin:left center;animation:fil 3s linear infinite}@keyframes fil{0%{transform:scaleX(0);opacity:1}92%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
.nm{animation:nm 1.6s cubic-bezier(0.22, 1, 0.36, 1) both}@keyframes nm{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

@media (prefers-reduced-motion: reduce){
